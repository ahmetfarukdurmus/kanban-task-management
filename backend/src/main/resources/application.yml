spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kanban_db}
    username: ${DB_USER:kanban_user}
    password: ${DB_PASS:kanban_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update          # use 'validate' in production
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Multipart file upload configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB       # per-file limit (10MB)
      max-request-size: 10MB    # total request limit (10MB)

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:Y2hhbmdlLW1lLXJlcGxhY2UtdGhpcy13aXRoLWEtc2VjdXJlLTI1Ni1iaXQtYmFzZTY0LWVuY29kZWQta2V5LWZvci1wcm9kdWN0aW9u}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  # Directory for uploaded attachments (relative to working dir, or absolute path)
  upload:
    dir: ${UPLOAD_DIR:uploads}
