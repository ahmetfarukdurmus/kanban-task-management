# ─────────────────────────────────────────────────────────────────────
# Nginx configuration for the Kanban frontend.
#
# Responsibilities:
#   1. Serve the React SPA static bundle (dist/).
#   2. Proxy /api/* to the backend container – so the browser never
#      makes cross-origin requests (CORS is a non-issue in production).
#   3. Implement SPA fallback (all unknown paths → index.html).
#   4. Gzip compression + aggressive caching for hashed assets.
# ─────────────────────────────────────────────────────────────────────

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Gzip ───────────────────────────────────────────────────────
    gzip             on;
    gzip_comp_level  6;
    gzip_min_length  1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── API proxy → Spring Boot backend ────────────────────────────
    # Requests to /api/... are forwarded to the backend service.
    # The context-path (/api) is preserved on both sides.
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable buffering for SSE / streaming (future-proof)
        proxy_buffering    off;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ── Static assets (Vite hashed filenames) ──────────────────────
    # Cache indefinitely; Vite fingerprints the filenames on rebuild.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA fallback ───────────────────────────────────────────────
    # All unmatched paths serve index.html so React Router handles routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ───────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin" always;
}
